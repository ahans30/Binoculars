name: 類似度チェック

on:
  push:
    branches: [main]
    paths: ["manuscripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: similarity-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIMCHECK_DATA_DIR: ${{ github.workspace }}/data/simcheck
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      # 公開リポジトリでは原稿もレポートも誰でも見られるので、処理しない
      - name: 非公開リポジトリか確認
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::公開リポジトリでは実行しません。リポジトリを非公開にしてください。"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 依存関係を導入
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation fonts-noto-cjk

      - name: 索引を取得
        run: |
          mkdir -p "$SIMCHECK_DATA_DIR"
          if ! gh release download corpus-index --pattern 'index.tar.gz.part*' --dir "$RUNNER_TEMP/index"; then
            echo "::error::索引がありません。先に「照合先の更新」を実行してください。"
            exit 1
          fi
          cat "$RUNNER_TEMP"/index/index.tar.gz.part* | tar -xzf - -C "$SIMCHECK_DATA_DIR"
          rm -rf "$RUNNER_TEMP/index"

      # 取得できなくても類似度の確認はできる。その場合はレポートに未確認と記載される
      - name: 不自然な語句と撤回論文のデータを取得
        continue-on-error: true
        run: python -m simcheck update-integrity

      - name: 確認する文書を決める
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && git rev-parse --verify -q HEAD~1 >/dev/null; then
            git -c core.quotepath=off diff --name-only --diff-filter=AM HEAD~1 HEAD -- manuscripts > "$RUNNER_TEMP/files.txt"
          else
            git -c core.quotepath=off ls-files -- manuscripts > "$RUNNER_TEMP/files.txt"
          fi
          grep -iE '\.(docx|pdf|txt|md)$' "$RUNNER_TEMP/files.txt" | grep -v '/README\.md$' > "$RUNNER_TEMP/targets.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/targets.txt")" >> "$GITHUB_OUTPUT"

      - name: 確認を実行
        if: ${{ steps.files.outputs.count != '0' }}
        run: |
          triage=""
          if [ -n "$GEMINI_API_KEY" ]; then triage="--triage"; fi
          while IFS= read -r file; do
            stem="$(basename "$file")"; stem="${stem%.*}"
            python -m simcheck check "$file" --no-semantic $triage --out "reports/${stem}_report.html" | tee -a "$RUNNER_TEMP/result.txt"
          done < "$RUNNER_TEMP/targets.txt"
          # ログと概要には値だけを出し、原稿の文章は出さない
          { echo "## 類似度チェック"; grep '^類似度' "$RUNNER_TEMP/result.txt"; } >> "$GITHUB_STEP_SUMMARY"

      - name: レポートを保存
        if: ${{ steps.files.outputs.count != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: similarity-reports
          path: reports/
          retention-days: 14
          if-no-files-found: error
